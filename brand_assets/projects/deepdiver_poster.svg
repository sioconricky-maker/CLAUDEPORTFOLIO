<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5fd6e0"/>
      <stop offset="30%" stop-color="#2299c9"/>
      <stop offset="60%" stop-color="#0d5a95"/>
      <stop offset="85%" stop-color="#062f5e"/>
      <stop offset="100%" stop-color="#020f2e"/>
    </linearGradient>
    <radialGradient id="abyssGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00ffd0" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00ffd0" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#00ffd0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="50%" stop-color="#a8f0ff"/>
      <stop offset="100%" stop-color="#5fd6e0"/>
    </linearGradient>
    <filter id="glow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow2" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="url(#water)"/>

  <!-- sun rays from surface -->
  <g opacity="0.25" fill="#ffffff">
    <polygon points="500,0 560,0 300,420 260,400"/>
    <polygon points="750,0 800,0 650,460 610,445"/>
    <polygon points="950,0 1010,0 1150,440 1100,455"/>
    <polygon points="1150,0 1210,0 1350,400 1300,420"/>
  </g>

  <!-- water surface line -->
  <path d="M0,60 Q 200,30 400,60 T 800,60 T 1200,60 T 1600,60 L1600,0 L0,0 Z" fill="#bdf3ff" opacity="0.5"/>

  <!-- glowing abyss at bottom -->
  <circle cx="800" cy="980" r="420" fill="url(#abyssGlow)"/>

  <!-- boat silhouette at top -->
  <g transform="translate(1300,70)" opacity="0.9">
    <path d="M -70,20 L 70,20 L 50,55 L -50,55 Z" fill="#3a2a1a"/>
    <rect x="-6" y="-60" width="8" height="80" fill="#3a2a1a"/>
    <path d="M 2,-58 L 60,10 L 2,10 Z" fill="#ffffff" opacity="0.85"/>
  </g>

  <!-- bubbles -->
  <g fill="#ffffff" opacity="0.55">
    <circle cx="420" cy="700" r="8"/>
    <circle cx="440" cy="640" r="5"/>
    <circle cx="410" cy="580" r="4"/>
    <circle cx="1120" cy="820" r="7"/>
    <circle cx="1140" cy="760" r="5"/>
    <circle cx="1110" cy="700" r="4"/>
    <circle cx="700" cy="880" r="6"/>
    <circle cx="715" cy="830" r="4"/>
  </g>

  <!-- fish -->
  <g transform="translate(360,470)" fill="#ffd23f" filter="url(#softGlow2)">
    <ellipse cx="0" cy="0" rx="34" ry="18"/>
    <polygon points="-30,0 -55,-16 -55,16"/>
    <circle cx="18" cy="-4" r="3" fill="#062f5e"/>
  </g>
  <g transform="translate(1200,560) scale(-1,1)" fill="#ff6ec7" filter="url(#softGlow2)">
    <ellipse cx="0" cy="0" rx="26" ry="14"/>
    <polygon points="-24,0 -44,-12 -44,12"/>
    <circle cx="14" cy="-3" r="2.5" fill="#062f5e"/>
  </g>
  <g transform="translate(950,720)" fill="#7bffb0" filter="url(#softGlow2)">
    <ellipse cx="0" cy="0" rx="20" ry="11"/>
    <polygon points="-18,0 -34,-9 -34,9"/>
  </g>

  <!-- diver figure -->
  <g transform="translate(820,530)" filter="url(#softGlow2)">
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
      <circle cx="0" cy="-40" r="20" fill="#ffffff" stroke="none"/>
      <line x1="0" y1="-20" x2="-6" y2="40"/>
      <line x1="-6" y1="40" x2="-40" y2="70"/>
      <line x1="-6" y1="40" x2="30" y2="75"/>
      <line x1="-2" y1="-4" x2="-40" y2="10"/>
      <line x1="-40" y1="10" x2="-70" y2="-10"/>
      <line x1="-2" y1="-4" x2="34" y2="0"/>
      <line x1="34" y1="0" x2="60" y2="-25"/>
    </g>
    <!-- oxygen tank -->
    <rect x="-18" y="-30" width="14" height="45" rx="6" fill="#ffd23f" opacity="0.9"/>
  </g>

  <!-- oxygen bar -->
  <g transform="translate(700,140)">
    <rect x="0" y="0" width="220" height="24" rx="12" fill="#062f5e" opacity="0.6" stroke="#ffffff" stroke-width="2"/>
    <rect x="4" y="4" width="150" height="16" rx="8" fill="#00ffd0"/>
    <text x="240" y="19" font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff" opacity="0.85">O2</text>
  </g>

  <!-- title -->
  <text x="800" y="330" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="104" letter-spacing="6" fill="url(#titleFill2)" filter="url(#glow2)">DEEP DIVE FISHING</text>

  <!-- tagline -->
  <text x="800" y="385" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="28" letter-spacing="6" fill="#eafffb" opacity="0.9">DIVE &#183; CATCH &#183; UPGRADE &#183; REACH THE ABYSS</text>

  <!-- credit -->
  <text x="800" y="950" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="2" fill="#ffffff" opacity="0.85">by Ricky Siocon</text>

  <!-- controls -->
  <text x="800" y="985" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="3" fill="#bdf3ff">WASD / ARROWS TO SWIM &#160;&#160;&#160;&#183;&#160;&#160;&#160; SPACE TO DIVE</text>
</svg>
