<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0a0e27"/>
      <stop offset="55%" stop-color="#0a0e27"/>
      <stop offset="100%" stop-color="#150a2e"/>
    </linearGradient>
    <radialGradient id="sun" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ff2fd6"/>
      <stop offset="45%" stop-color="#ff2fd6" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ff2fd6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="sunBands" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="50%" stop-color="#ff6ec7"/>
      <stop offset="100%" stop-color="#7b2ff7"/>
    </linearGradient>
    <linearGradient id="gridGlow" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00f0ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00f0ff" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="titleFill" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#00f0ff"/>
      <stop offset="55%" stop-color="#7b8bff"/>
      <stop offset="100%" stop-color="#ff2fd6"/>
    </linearGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="sunClip">
      <circle cx="800" cy="430" r="150"/>
    </clipPath>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="80" r="2" opacity="0.7"/>
    <circle cx="260" cy="150" r="1.5" opacity="0.5"/>
    <circle cx="420" cy="60" r="2" opacity="0.6"/>
    <circle cx="1500" cy="100" r="2" opacity="0.6"/>
    <circle cx="1380" cy="200" r="1.5" opacity="0.5"/>
    <circle cx="1200" cy="70" r="2" opacity="0.7"/>
    <circle cx="90" cy="260" r="1.5" opacity="0.4"/>
    <circle cx="1520" cy="300" r="1.5" opacity="0.5"/>
    <circle cx="700" cy="40" r="1.5" opacity="0.5"/>
    <circle cx="980" cy="90" r="2" opacity="0.6"/>
  </g>

  <!-- sun -->
  <circle cx="800" cy="430" r="160" fill="url(#sun)"/>
  <g clip-path="url(#sunClip)">
    <rect x="650" y="280" width="300" height="300" fill="url(#sunBands)"/>
    <rect x="650" y="330" width="300" height="10" fill="#0a0e27"/>
    <rect x="650" y="360" width="300" height="10" fill="#0a0e27"/>
    <rect x="650" y="392" width="300" height="12" fill="#0a0e27"/>
    <rect x="650" y="426" width="300" height="14" fill="#0a0e27"/>
    <rect x="650" y="462" width="300" height="16" fill="#0a0e27"/>
    <rect x="650" y="500" width="300" height="20" fill="#0a0e27"/>
    <rect x="650" y="542" width="300" height="24" fill="#0a0e27"/>
  </g>
  <circle cx="800" cy="430" r="160" fill="none" stroke="#ffd23f" stroke-width="2" opacity="0.5"/>

  <!-- horizon line -->
  <line x1="0" y1="590" x2="1600" y2="590" stroke="#00f0ff" stroke-width="3" filter="url(#glow)"/>

  <!-- perspective grid floor -->
  <g stroke="url(#gridGlow)" stroke-width="2" opacity="0.85">
    <line x1="800" y1="590" x2="-400" y2="1000"/>
    <line x1="800" y1="590" x2="0" y2="1000"/>
    <line x1="800" y1="590" x2="300" y2="1000"/>
    <line x1="800" y1="590" x2="550" y2="1000"/>
    <line x1="800" y1="590" x2="700" y2="1000"/>
    <line x1="800" y1="590" x2="800" y2="1000"/>
    <line x1="800" y1="590" x2="900" y2="1000"/>
    <line x1="800" y1="590" x2="1050" y2="1000"/>
    <line x1="800" y1="590" x2="1300" y2="1000"/>
    <line x1="800" y1="590" x2="1600" y2="1000"/>
    <line x1="800" y1="590" x2="2000" y2="1000"/>
  </g>
  <g stroke="#00f0ff" stroke-width="1.5" opacity="0.55">
    <line x1="130" y1="650" x2="1470" y2="650"/>
    <line x1="230" y1="720" x2="1370" y2="720"/>
    <line x1="330" y1="800" x2="1270" y2="800"/>
    <line x1="180" y1="900" x2="1420" y2="900"/>
  </g>

  <!-- stick figure runner, mid-jump -->
  <g transform="translate(1080,760)" filter="url(#softGlow)">
    <g stroke="#ffffff" stroke-width="10" stroke-linecap="round" fill="none">
      <!-- torso -->
      <line x1="0" y1="-40" x2="-18" y2="20"/>
      <!-- head -->
      <circle cx="8" cy="-70" r="18" fill="#ffffff" stroke="none"/>
      <!-- back leg bent -->
      <line x1="-18" y1="20" x2="-55" y2="10"/>
      <line x1="-55" y1="10" x2="-70" y2="45"/>
      <!-- front leg extended forward -->
      <line x1="-18" y1="20" x2="30" y2="35"/>
      <line x1="30" y1="35" x2="60" y2="20"/>
      <!-- back arm -->
      <line x1="0" y1="-30" x2="30" y2="-5"/>
      <line x1="30" y1="-5" x2="55" y2="-30"/>
      <!-- front arm -->
      <line x1="0" y1="-30" x2="-35" y2="-15"/>
      <line x1="-35" y1="-15" x2="-55" y2 ="-40"/>
    </g>
  </g>
  <!-- motion trail -->
  <g stroke="#ff2fd6" stroke-width="4" opacity="0.5" stroke-linecap="round">
    <line x1="960" y1="770" x2="1030" y2="765"/>
    <line x1="940" y1="800" x2="1010" y2="795"/>
    <line x1="980" y1="830" x2="1040" y2="822"/>
  </g>

  <!-- shard power-up icons floating -->
  <g transform="translate(300,700)" filter="url(#softGlow)">
    <polygon points="0,-26 16,0 0,26 -16,0" fill="#00f0ff" opacity="0.9"/>
  </g>
  <g transform="translate(420,620)" filter="url(#softGlow)">
    <polygon points="0,-18 11,0 0,18 -11,0" fill="#ff2fd6" opacity="0.85"/>
  </g>
  <g transform="translate(1250,650)" filter="url(#softGlow)">
    <polygon points="0,-20 13,0 0,20 -13,0" fill="#ffd23f" opacity="0.85"/>
  </g>

  <!-- title -->
  <text x="800" y="200" text-anchor="middle" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="118" letter-spacing="10" fill="url(#titleFill)" filter="url(#glow)">GRIDRUNNER</text>

  <!-- tagline -->
  <text x="800" y="260" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-weight="400" font-size="30" letter-spacing="8" fill="#8be9ff" opacity="0.9">AN ENDLESS SIGNAL RUN</text>

  <!-- credit -->
  <text x="800" y="940" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="24" letter-spacing="2" fill="#ffffff" opacity="0.75">by Ricky Siocon</text>

  <!-- controls legend -->
  <text x="800" y="980" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="20" letter-spacing="3" fill="#7b8bff">&#8593; JUMP &#160;&#160;&#160; &#8595; SLIDE &#160;&#160;&#160; SHIELD &#183; DECOY &#183; LASER</text>
</svg>
