<svg viewBox="0 0 1600 1000" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg3" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b0f1e"/>
      <stop offset="55%" stop-color="#0e1424"/>
      <stop offset="100%" stop-color="#1a1206"/>
    </linearGradient>
    <radialGradient id="glowSpot" cx="15%" cy="30%" r="60%">
      <stop offset="0%" stop-color="#ff9d2f" stop-opacity="0.28"/>
      <stop offset="100%" stop-color="#ff9d2f" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="titleFill3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffd23f"/>
      <stop offset="100%" stop-color="#ff9d2f"/>
    </linearGradient>
    <filter id="glow3" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="7" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect x="0" y="0" width="1600" height="1000" fill="url(#bg3)"/>
  <rect x="0" y="0" width="1600" height="1000" fill="url(#glowSpot)"/>

  <!-- eyebrow badge -->
  <circle cx="90" cy="80" r="7" fill="#ffb54a"/>
  <text x="112" y="88" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="22" letter-spacing="3" fill="#ffb54a">CLAUDE AGENT SKILL &#183; PORTFOLIO PROJECT</text>

  <!-- title -->
  <text x="90" y="180" font-family="Arial Black, Helvetica, sans-serif" font-weight="900" font-size="72" fill="#ffffff">PH LEAD GENERATOR</text>
  <text x="90" y="230" font-family="Arial, Helvetica, sans-serif" font-size="30" fill="url(#titleFill3)">PH AI Automation Opportunity Finder</text>

  <!-- description -->
  <text x="90" y="285" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c7cede">A Claude skill that turns market research into a validated pipeline of</text>
  <text x="90" y="318" font-family="Arial, Helvetica, sans-serif" font-size="24" fill="#c7cede">AI automation opportunities for Philippine businesses.</text>

  <!-- built on pills -->
  <text x="90" y="380" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#8890a6">BUILT ON</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#ffffff">
    <rect x="90" y="400" width="150" height="50" rx="25" fill="#1c2337" stroke="#3a4360"/>
    <text x="165" y="432" text-anchor="middle">Claude AI</text>
    <rect x="255" y="400" width="150" height="50" rx="25" fill="#1c2337" stroke="#3a4360"/>
    <text x="330" y="432" text-anchor="middle">ChatGPT</text>
    <rect x="420" y="400" width="90" height="50" rx="25" fill="#1c2337" stroke="#3a4360"/>
    <text x="465" y="432" text-anchor="middle">n8n</text>
    <rect x="525" y="400" width="150" height="50" rx="25" fill="#1c2337" stroke="#3a4360"/>
    <text x="600" y="432" text-anchor="middle">Pinecone</text>
    <rect x="690" y="400" width="150" height="50" rx="25" fill="#1c2337" stroke="#3a4360"/>
    <text x="765" y="432" text-anchor="middle">Supabase</text>
  </g>

  <!-- workflow chain -->
  <text x="90" y="510" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#8890a6">AUTOMATION WORKFLOW</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#ffffff">
    <rect x="90" y="530" width="110" height="46" rx="8" fill="#1c2337" stroke="#3a4360"/>
    <text x="145" y="559" text-anchor="middle">Input</text>
    <text x="212" y="559" fill="#5c6580">&#8594;</text>
    <rect x="232" y="530" width="90" height="46" rx="8" fill="#1c2337" stroke="#3a4360"/>
    <text x="277" y="559" text-anchor="middle">n8n</text>
    <text x="334" y="559" fill="#5c6580">&#8594;</text>
    <rect x="354" y="530" width="140" height="46" rx="8" fill="#3d6bff" stroke="#5f85ff"/>
    <text x="424" y="559" text-anchor="middle">Claude AI</text>
    <text x="506" y="559" fill="#5c6580">&#8594;</text>
    <rect x="526" y="530" width="130" height="46" rx="8" fill="#1c2337" stroke="#3a4360"/>
    <text x="591" y="559" text-anchor="middle">Pinecone</text>
    <text x="668" y="559" fill="#5c6580">&#8594;</text>
    <rect x="688" y="530" width="130" height="46" rx="8" fill="#1c2337" stroke="#3a4360"/>
    <text x="753" y="559" text-anchor="middle">Supabase</text>
    <text x="830" y="559" fill="#5c6580">&#8594;</text>
    <rect x="850" y="530" width="190" height="46" rx="8" fill="#1c2337" stroke="#3a4360"/>
    <text x="945" y="559" text-anchor="middle">Business Systems</text>
    <text x="1052" y="559" fill="#5c6580">&#8594;</text>
    <rect x="1072" y="530" width="120" height="46" rx="8" fill="#1c2337" stroke="#3a4360"/>
    <text x="1132" y="559" text-anchor="middle">Reports</text>
  </g>

  <!-- stat cards -->
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="1220" y="330" width="300" height="110" rx="12" fill="#141a2c" stroke="#2a3350"/>
    <text x="1250" y="380" font-size="46" font-weight="900" fill="url(#titleFill3)" filter="url(#glow3)">Top 5</text>
    <text x="1250" y="410" font-size="18" fill="#8890a6">validated opportunities per run</text>

    <rect x="1220" y="455" width="300" height="110" rx="12" fill="#141a2c" stroke="#2a3350"/>
    <text x="1250" y="505" font-size="46" font-weight="900" fill="url(#titleFill3)" filter="url(#glow3)">14 pts</text>
    <text x="1250" y="535" font-size="18" fill="#8890a6">of analysis per opportunity</text>

    <rect x="1220" y="580" width="300" height="110" rx="12" fill="#141a2c" stroke="#2a3350"/>
    <text x="1250" y="630" font-size="46" font-weight="900" fill="url(#titleFill3)" filter="url(#glow3)">&#8369;1M+</text>
    <text x="1250" y="660" font-size="18" fill="#8890a6">target MRR ambition</text>
  </g>

  <!-- target industries -->
  <text x="90" y="650" font-family="Arial, Helvetica, sans-serif" font-weight="700" font-size="20" letter-spacing="2" fill="#8890a6">TARGET INDUSTRIES</text>
  <g font-family="Arial, Helvetica, sans-serif" font-size="20" fill="#c7cede">
    <rect x="90" y="670" width="150" height="46" rx="23" fill="#1c2337" stroke="#3a4360"/>
    <text x="165" y="700" text-anchor="middle">Real Estate</text>
    <rect x="255" y="670" width="100" height="46" rx="23" fill="#1c2337" stroke="#3a4360"/>
    <text x="305" y="700" text-anchor="middle">BPO</text>
    <rect x="370" y="670" width="170" height="46" rx="23" fill="#1c2337" stroke="#3a4360"/>
    <text x="455" y="700" text-anchor="middle">Accounting</text>
    <rect x="555" y="670" width="150" height="46" rx="23" fill="#1c2337" stroke="#3a4360"/>
    <text x="630" y="700" text-anchor="middle">Logistics</text>
    <rect x="720" y="670" width="230" height="46" rx="23" fill="#1c2337" stroke="#3a4360"/>
    <text x="835" y="700" text-anchor="middle">HR &amp; Recruiting</text>
    <rect x="965" y="670" width="150" height="46" rx="23" fill="#1c2337" stroke="#3a4360"/>
    <text x="1040" y="700" text-anchor="middle">Law Firms</text>
    <rect x="1130" y="670" width="190" height="46" rx="23" fill="#1c2337" stroke="#3a4360"/>
    <text x="1225" y="700" text-anchor="middle">Retail / E-com</text>
  </g>

  <!-- footer -->
  <line x1="90" y1="900" x2="1520" y2="900" stroke="#2a3350" stroke-width="2"/>
  <text x="90" y="945" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#8890a6">Designed &amp; prompted by Ricky Siocon &#8212; built as a Claude Agent Skill</text>
</svg>
